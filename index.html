<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080c17">
  <title>Portfolio | Pokédex</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-mark">AL</span>
      Aaron.<span class="accent">dev</span>
    </a>
    <span class="subtitle">Let's Talk</span>
  </header>

  <main class="container">
    <section class="intro">
      <p class="eyebrow">EXPLORE THE WORLD OF POKÉMON</p>
      <h1>Discover your next <span class="accent">Pokémon.</span></h1>
      <p>Search by name or Pokédex number to explore Pokémon data.</p>
    </section>

    <section class="search-panel" aria-label="Pokémon search">
      <label for="pokemonSearch">Pokémon name or ID</label>
      <div class="search-row">
        <input
          id="pokemonSearch"
          type="search"
          placeholder="Try Pikachu or 25"
          autocomplete="off"
        >
        <button id="searchBtn" type="button">Search</button>
      </div>
      <div class="filter-row">
        <label for="typeFilter">Filter by type</label>

        <select id="typeFilter">
          <option value="all">All types</option>
          <option value="normal">Normal</option>
          <option value="fire">Fire</option>
          <option value="water">Water</option>
          <option value="electric">Electric</option>
          <option value="grass">Grass</option>
          <option value="ice">Ice</option>
          <option value="fighting">Fighting</option>
          <option value="poison">Poison</option>
          <option value="ground">Ground</option>
          <option value="flying">Flying</option>
          <option value="psychic">Psychic</option>
          <option value="bug">Bug</option>
          <option value="rock">Rock</option>
          <option value="ghost">Ghost</option>
          <option value="dragon">Dragon</option>
          <option value="dark">Dark</option>
          <option value="steel">Steel</option>
          <option value="fairy">Fairy</option>
        </select>
      </div>
    </section>
    
    <p id="status" role="status" aria-live="polite">
      Ready to explore.
    </p>

    <section
      id="pokemonGrid"
      class="pokemon-grid"
      aria-label="Pokémon results"
    ></section>
    
    <nav class="pagination" aria-label="Pokémon pages">
      <button id="prevBtn" type="button" disabled>
        Previous
      </button>

      <span id="pageInfo" aria-live="polite">Page 1</span>

      <button id="nextBtn" type="button">
        Next
      </button>
    </nav>
  </main>
</body>
</html>
